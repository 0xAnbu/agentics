name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - name: lint + format
        run: ruff format --check agentlink api tests scripts && ruff check agentlink api tests scripts
      - name: types
        run: mypy
      - name: tests (SQLite)
        run: pytest -q -p no:warnings
      - name: tests (Postgres 17)
        env:
          AGENTLINK_TEST_PG_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest -q -p no:warnings
      - name: smoke (real server + CLI + MCP)
        run: PY=python bash scripts/smoke.sh
